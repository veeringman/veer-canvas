<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit quote — Housing Colony Sanyard</title>
  <meta name="theme-color" content="#15233f">
  <link rel="icon" href="assets/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --primary: #1a4f7a;
      --navy: #15233f;
      --surface: #ffffff;
      --bg: #f3f6fa;
      --text: #1a2236;
      --muted: #64748b;
      --radius: 12px;
      --ok: #1a6b45;
    }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }
    html[lang="hi"] body { font-family: "Noto Sans Devanagari", Inter, system-ui, sans-serif; }
    .page { width: 100%; max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .brand picture, .brand img { display: block; }
    .brand-line { margin: 0; font-size: 0.82rem; color: var(--muted); font-weight: 500; }
    .lang-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.28rem;
      padding: 0.18rem;
      border-radius: 999px;
      border: 1px solid rgba(196, 161, 90, 0.55);
      background: rgba(255, 252, 246, 0.95);
    }
    .lang-btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-width: 2.4rem;
      height: 2rem;
      padding: 0 0.55rem;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }
    .lang-btn.is-active { background: var(--navy); color: #f7f3eb; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 1.25rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.25rem; }
    .meta { color: var(--muted); font-size: 0.86rem; margin: 0 0 0.75rem; }
    .summary { color: var(--muted); margin: 0 0 0.75rem; font-size: 0.93rem; }
    .details { margin: 0.5rem 0 1rem; font-size: 0.9rem; line-height: 1.55; white-space: pre-wrap; }
    .note {
      margin: 0.75rem 0;
      padding: 0.65rem 0.75rem;
      background: rgba(26,79,122,0.06);
      border-radius: 8px;
      font-size: 0.88rem;
    }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin: 0.65rem 0 0.3rem; }
    input, textarea {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid rgba(15,40,80,0.15);
      border-radius: 8px;
      font: inherit;
      font-size: 0.92rem;
    }
    textarea { min-height: 6rem; resize: vertical; }
    .btn {
      margin-top: 1rem;
      width: 100%;
      padding: 0.7rem;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 0.65rem; font-size: 0.86rem; color: var(--muted); }
    .msg.ok { color: var(--ok); }
    .msg.err { color: #b91c1c; }
    .loading { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .done-box {
      padding: 0.85rem;
      background: rgba(26,107,69,0.08);
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand">
      <picture>
        <source type="image/webp" srcset="assets/mhws-logo/mhws-logo-web-256.webp">
        <img src="assets/mhws-logo/mhws-logo-web-256.png" width="72" height="72" alt="Mandi Housing Welfare Society" decoding="async">
      </picture>
      <p class="brand-line" id="brandLine">Mandi Housing Welfare Society · Housing Colony Sanyard</p>
      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" class="lang-btn" data-lang="hi" aria-pressed="false">हिं</button>
      </div>
    </header>
    <div id="root" class="card">
      <p class="loading">Loading requirement…</p>
    </div>
  </div>
  <script>
    (() => {
      const STRINGS = {
        en: {
          brand: "Mandi Housing Welfare Society · Housing Colony Sanyard",
          loading: "Loading requirement…",
          missing: "Missing quote link. Ask the colony to resend the invite.",
          invalid: "Invalid or expired quote link",
          workFallback: "Work requirement",
          colonyFallback: "Colony work",
          already: "Quote already submitted",
          thanks: "Thank you, {name}. The colony has your response in their mailbox and Quotes section.",
          amount: "Amount",
          noteFrom: "Note from colony",
          inviteFor: "Invite for",
          name: "Your name / firm *",
          phone: "Phone",
          quoteAmount: "Your quote amount (₹) *",
          amountPh: "Enter your quoted amount",
          timeline: "Timeline / availability",
          timelinePh: "e.g. 7–10 days after award",
          details: "Quote details *",
          detailsPh: "Scope covered, inclusions, taxes, validity…",
          submit: "Submit quote",
          pageTitle: "Quote",
          copyHint: "A copy is emailed to the colony mailbox and stored under Quotes for this project.",
          sending: "Sending…",
          submitted: "Quote submitted. The colony will review it in Quotes and their mailbox.",
          submitFail: "Could not submit",
          loadFail: "Could not load",
        },
        hi: {
          brand: "मंडी हाउसिंग वेलफेयर सोसाइटी · हाउसिंग कॉलोनी सनयार्ड",
          loading: "आवश्यकता लोड हो रही है…",
          missing: "कोट लिंक नहीं मिला। कॉलोनी से आमंत्रण फिर भेजने को कहें।",
          invalid: "अमान्य या समाप्त कोट लिंक",
          workFallback: "कार्य आवश्यकता",
          colonyFallback: "कॉलोनी कार्य",
          already: "कोट पहले ही जमा हो चुका है",
          thanks: "धन्यवाद, {name}। कॉलोनी के पास आपका उत्तर मेलबॉक्स और कोट्स खंड में है।",
          amount: "राशि",
          noteFrom: "कॉलोनी का नोट",
          inviteFor: "आमंत्रण",
          name: "आपका नाम / फर्म *",
          phone: "फ़ोन",
          quoteAmount: "आपकी कोट राशि (₹) *",
          amountPh: "अपनी कोट राशि लिखें",
          timeline: "समय / उपलब्धता",
          timelinePh: "जैसे पुरस्कार के 7–10 दिन बाद",
          details: "कोट विवरण *",
          detailsPh: "कार्यक्षेत्र, शामिल वस्तुएँ, कर, वैधता…",
          submit: "कोट जमा करें",
          pageTitle: "कोट",
          copyHint: "एक प्रति कॉलोनी मेलबॉक्स पर जाती है और इस परियोजना के कोट्स में संग्रहीत होती है।",
          sending: "भेजा जा रहा है…",
          submitted: "कोट जमा हो गया। कॉलोनी इसे कोट्स और मेलबॉक्स में देखेगी।",
          submitFail: "जमा नहीं हो सका",
          loadFail: "लोड नहीं हो सका",
        },
      };
      const params = new URLSearchParams(location.search);
      const token = (params.get("t") || params.get("token") || "").trim();
      const root = document.getElementById("root");
      const LANG_KEY = "hbc-sanyard-public-lang";
      let lang = "en";
      let lastPayload = null;
      let lastError = "";

      try {
        lang = localStorage.getItem(LANG_KEY) === "hi" ? "hi" : "en";
      } catch (_e) {
        lang = "en";
      }

      function t(key) {
        return (STRINGS[lang] || STRINGS.en)[key] || STRINGS.en[key] || key;
      }

      function esc(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function rupee(n) {
        if (n == null || n === "") return "";
        return "₹" + Number(n).toLocaleString("en-IN");
      }

      function applyLangChrome() {
        document.documentElement.lang = lang === "hi" ? "hi" : "en";
        const brand = document.getElementById("brandLine");
        if (brand) brand.textContent = t("brand");
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          const on = btn.getAttribute("data-lang") === lang;
          btn.classList.toggle("is-active", on);
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }

      function setLang(next) {
        lang = next === "hi" ? "hi" : "en";
        try { localStorage.setItem(LANG_KEY, lang); } catch (_e) {}
        applyLangChrome();
        if (lastPayload) render(lastPayload);
        else if (lastError) showError(lastError);
      }

      function showError(message) {
        lastError = message;
        lastPayload = null;
        root.innerHTML = `<p class="msg err">${esc(message)}</p>`;
      }

      function render(data) {
        lastPayload = data;
        lastError = "";
        const work = data.work || {};
        const invite = data.invite || {};
        const existing = data.response;
        document.title = `${t("pageTitle")} — ${work.title || t("colonyFallback")}`;

        if (existing) {
          const thanks = t("thanks").replace("{name}", existing.vendorName || "");
          root.innerHTML = `
            <h1>${esc(work.title || t("workFallback"))}</h1>
            <p class="meta">${esc(work.kindLabel || "")}${work.location ? " · " + esc(work.location) : ""}</p>
            <div class="done-box">
              <strong>${esc(t("already"))}</strong>
              <p style="margin:0.4rem 0 0">${esc(thanks)}</p>
              ${existing.amount != null ? `<p style="margin:0.4rem 0 0">${esc(t("amount"))}: <strong>${esc(rupee(existing.amount))}</strong></p>` : ""}
            </div>`;
          return;
        }

        root.innerHTML = `
          <h1>${esc(work.title || t("workFallback"))}</h1>
          <p class="meta">${esc(work.kindLabel || "")}${work.categoryLabel ? " · " + esc(work.categoryLabel) : ""}${work.location ? " · " + esc(work.location) : ""}</p>
          ${work.summary ? `<p class="summary">${esc(work.summary)}</p>` : ""}
          ${work.details ? `<div class="details">${esc(work.details)}</div>` : ""}
          ${invite.message ? `<div class="note"><strong>${esc(t("noteFrom"))}</strong><br>${esc(invite.message)}</div>` : ""}
          <p class="meta">${esc(t("inviteFor"))}: ${esc(invite.vendorEmail || "")}</p>
          <form id="quoteForm">
            <label>${esc(t("name"))}</label>
            <input id="vendorName" name="vendorName" required maxlength="120" autocomplete="organization">
            <label>${esc(t("phone"))}</label>
            <input id="vendorPhone" name="vendorPhone" maxlength="40" inputmode="tel" autocomplete="tel">
            <label>${esc(t("quoteAmount"))}</label>
            <input id="amount" name="amount" type="number" min="0" step="1" required placeholder="${esc(t("amountPh"))}">
            <label>${esc(t("timeline"))}</label>
            <input id="timeline" name="timeline" maxlength="400" placeholder="${esc(t("timelinePh"))}">
            <label>${esc(t("details"))}</label>
            <textarea id="notes" name="notes" required maxlength="4000" placeholder="${esc(t("detailsPh"))}"></textarea>
            <button class="btn" type="submit" id="submitBtn">${esc(t("submit"))}</button>
            <p class="msg" id="formMsg">${esc(t("copyHint"))}</p>
          </form>`;

        document.getElementById("quoteForm").addEventListener("submit", onSubmit);
      }

      async function load() {
        applyLangChrome();
        if (!token) {
          showError(t("missing"));
          return;
        }
        root.innerHTML = `<p class="loading">${esc(t("loading"))}</p>`;
        const res = await fetch(`/api/rwa/public/quotes/${encodeURIComponent(token)}`, {
          cache: "no-store",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || t("invalid"));
          return;
        }
        render(data);
      }

      async function onSubmit(event) {
        event.preventDefault();
        const btn = document.getElementById("submitBtn");
        const msg = document.getElementById("formMsg");
        btn.disabled = true;
        msg.className = "msg";
        msg.textContent = t("sending");
        try {
          const res = await fetch(`/api/rwa/public/quotes/${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              vendorName: document.getElementById("vendorName").value.trim(),
              vendorPhone: document.getElementById("vendorPhone").value.trim(),
              amount: document.getElementById("amount").value,
              timeline: document.getElementById("timeline").value.trim(),
              notes: document.getElementById("notes").value.trim(),
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `Failed (${res.status})`);
          msg.className = "msg ok";
          msg.textContent = t("submitted");
          setTimeout(load, 800);
        } catch (err) {
          msg.className = "msg err";
          msg.textContent = err.message || t("submitFail");
          btn.disabled = false;
        }
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang")));
      });

      load().catch((err) => {
        showError(err.message || t("loadFail"));
      });
    })();
  </script>
</body>
</html>
