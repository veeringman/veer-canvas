<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Himuda Housing Colony Sanyard — Cash Receipt Booklet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 4mm; }
    @page a5-sheet { size: A5 portrait; margin: 3mm; }
    @page a5-landscape { size: A5 landscape; margin: 3mm; }
    @page a4-landscape { size: A4 landscape; margin: 3mm; }
    * { box-sizing: border-box; }
    :root {
      --navy: #0b2a56;
      --navy-2: #143a6e;
      --green: #1a6b3a;
      --gold: #c9a227;
      --ink: #12233f;
      --muted: #5a6a80;
      --line: rgba(11, 42, 86, 0.28);
      --paper: #ffffff;
      --soft: #ffffff;
    }
    body {
      margin: 0;
      color: var(--ink);
      background: #cfd8e6;
      font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    }
    .screen-hint {
      max-width: 210mm;
      margin: 0 auto;
      padding: 10px 14px;
      text-align: center;
      font: 500 13px/1.45 system-ui, sans-serif;
      color: #445;
    }
    .sheet {
      width: 210mm;
      height: 297mm;
      max-height: 297mm;
      margin: 0 auto 18px;
      padding: 3mm 5mm;
      background: var(--paper);
      border: 1.25pt solid var(--navy);
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: hidden;
    }

    .sheet.layout-a5-2 {
      width: 148mm;
      height: 210mm;
      max-height: 210mm;
      page: a5-sheet;
    }
    .sheet.layout-a4-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      align-content: stretch;
    }
    .sheet.layout-a4-4 .receipt {
      max-height: none;
    }
    .sheet.layout-a5-2 .receipt {
      max-height: 50%;
    }

    /* Landscape — slips side-by-side (vertical tear between columns) */
    .sheet.orient-landscape.layout-a5-2 {
      width: 210mm;
      height: 148mm;
      max-height: 148mm;
      flex-direction: row;
      page: a5-landscape;
    }
    .sheet.orient-landscape.layout-a5-2 .receipt {
      max-height: none;
      max-width: 50%;
      flex: 1 1 0;
    }
    .sheet.orient-landscape.layout-a4-3 {
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      flex-direction: row;
      page: a4-landscape;
    }
    .sheet.orient-landscape.layout-a4-3 .receipt {
      max-height: none;
      max-width: 33.33%;
      flex: 1 1 0;
    }
    .sheet.orient-landscape.layout-a4-4 {
      width: 297mm;
      height: 210mm;
      max-height: 210mm;
      page: a4-landscape;
    }

    .perf-vert {
      flex: 0 0 auto;
      width: 0;
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 5pt;
      letter-spacing: 0.12em;
      color: rgba(11, 42, 86, 0.35);
      text-transform: uppercase;
      padding: 0 0.5mm;
    }

    /* Three tear-off receipts per A4 page — no outer border */
    .receipt {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      max-height: 33.33%;
      border: 0;
      padding: 2mm 3.5mm 1.5mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: transparent;
    }
    .receipt + .receipt {
      margin-top: 0;
      border: 0;
    }
    .r-wm {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      height: 70%;
      max-width: 78%;
      max-height: 70%;
      object-fit: contain;
      opacity: 0.72;
      pointer-events: none;
      z-index: 0;
    }
    .receipt > *:not(.r-wm):not(.r-bg):not(.r-bg-svg) { position: relative; z-index: 1; }

    /* Tint + pattern as SVG so print/PDF always includes them */
    .r-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .r-bg { display: none; }

    .r-top {
      display: grid;
      grid-template-columns: 13mm 1fr auto;
      gap: 2.5mm;
      align-items: center;
      padding-bottom: 1.2mm;
      border-bottom: 0.7pt solid rgba(11, 42, 86, 0.35);
    }
    .r-logo {
      width: 12mm;
      height: auto;
      display: block;
    }
    .r-org h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 10pt;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--navy);
      text-transform: uppercase;
      line-height: 1.05;
    }
    .r-org .colony {
      margin: 0.2mm 0 0;
      font-size: 7.2pt;
      font-weight: 700;
      color: var(--navy-2, #143a6e);
    }
    .r-org .addr {
      margin: 0.3mm 0 0;
      font-size: 6.4pt;
      font-weight: 600;
      color: var(--green);
    }
    .r-meta {
      text-align: right;
      font-size: 7.2pt;
      line-height: 1.35;
      color: var(--muted);
      min-width: 46mm;
    }
    .r-meta strong {
      display: block;
      font-size: 8.5pt;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 1.2mm;
    }
    .r-meta .rcpt-no-label {
      display: block;
      font-size: 6.4pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4mm;
    }
    .r-meta .rcpt-no {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: 12pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #c62828;
      line-height: 1.1;
      margin-bottom: 0.8mm;
    }
    .r-meta .fill {
      display: inline-block;
      min-width: 28mm;
      border-bottom: 1px solid rgba(11, 42, 86, 0.45);
      height: 3.2mm;
      vertical-align: bottom;
      margin-left: 1mm;
    }

    .screen-controls {
      max-width: 210mm;
      margin: 0 auto 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid rgba(11, 42, 86, 0.18);
      border-radius: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px 14px;
      align-items: end;
      font: 500 13px/1.35 system-ui, sans-serif;
      color: #223;
    }
    .screen-controls label {
      display: grid;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #5a6a80;
    }
    .screen-controls input,
    .screen-controls select {
      font: 600 13px/1.2 system-ui, sans-serif;
      padding: 7px 9px;
      border: 1px solid rgba(11, 42, 86, 0.25);
      border-radius: 7px;
      color: #12233f;
      text-transform: none;
      letter-spacing: normal;
    }
    .screen-controls .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .screen-controls button {
      border: 0;
      border-radius: 7px;
      padding: 8px 14px;
      font: 700 13px/1.2 system-ui, sans-serif;
      cursor: pointer;
      background: #0b2a56;
      color: #fff;
    }
    .screen-controls button.secondary {
      background: #e8eef6;
      color: #0b2a56;
    }

    .r-banner {
      margin: 1.2mm 0 1.4mm;
      text-align: center;
      background: linear-gradient(90deg, var(--navy), var(--navy-2));
      color: #f7f3ea;
      font-size: 7pt;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 1mm 2.5mm;
    }
    .r-banner .gold { color: var(--gold); margin: 0 1.5mm; }

    .fields {
      display: grid;
      gap: 1.1mm;
      font-size: 7.5pt;
      flex: 1;
    }
    .row {
      display: grid;
      grid-template-columns: 28mm 1fr;
      gap: 2mm;
      align-items: end;
    }
    .row.two {
      grid-template-columns: 28mm 1fr 22mm 1fr;
    }
    .lbl {
      font-size: 7pt;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--green);
      padding-bottom: 0.4mm;
    }
    .line {
      border-bottom: 1px solid rgba(11, 42, 86, 0.42);
      min-height: 3.4mm;
    }
    .amount-box {
      display: grid;
      grid-template-columns: 28mm 1fr;
      gap: 2mm;
      align-items: stretch;
      margin-top: 0.2mm;
    }
    .amount-value {
      border: 1pt solid var(--navy);
      background: var(--soft);
      min-height: 6.5mm;
      display: flex;
      align-items: center;
      padding: 0.6mm 2mm;
      font-weight: 700;
      font-size: 10pt;
      color: var(--navy);
      letter-spacing: 0.02em;
    }
    .amount-value::before {
      content: "₹";
      margin-right: 2mm;
      color: var(--green);
      font-size: 10pt;
    }
    .purpose {
      display: flex;
      flex-wrap: wrap;
      gap: 2mm 4mm;
      align-items: center;
      margin-top: 0.4mm;
      font-size: 7.4pt;
      font-weight: 600;
      color: var(--ink);
    }
    .purpose .chk {
      display: inline-flex;
      align-items: center;
      gap: 1.2mm;
    }
    .purpose .box {
      width: 3.2mm;
      height: 3.2mm;
      border: 1px solid var(--navy);
      display: inline-block;
    }

    .r-foot {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 3mm;
      margin-top: 1.2mm;
      padding-top: 1.2mm;
      border-top: 0.6pt solid var(--line);
      align-items: end;
    }
    .note {
      font-size: 6pt;
      color: var(--muted);
      line-height: 1.3;
    }
    .note strong {
      color: var(--navy);
      font-weight: 700;
    }
    .sign {
      text-align: center;
      font-size: 6.5pt;
      color: var(--muted);
    }
    .sign .space {
      height: 6mm;
      border-bottom: 1px solid rgba(11, 42, 86, 0.4);
      margin-bottom: 0.6mm;
    }
    .sign .who {
      font-weight: 700;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 6.6pt;
    }
    .sign .role {
      font-size: 6pt;
      color: var(--green);
      font-weight: 600;
    }

    /* Compact slip — A6 grid / A5 half-page */
    .layout-a4-4 .receipt,
    .layout-a5-2 .receipt {
      padding: 1.5mm 2.5mm 1mm;
    }
    .layout-a4-4 .r-top {
      grid-template-columns: 10mm 1fr auto;
      gap: 1.8mm;
      padding-bottom: 0.8mm;
    }
    .layout-a4-4 .r-logo { width: 9mm; }
    .layout-a4-4 .r-org h1 { font-size: 7.8pt; }
    .layout-a4-4 .r-org .colony { font-size: 6.4pt; }
    .layout-a4-4 .r-org .addr { font-size: 5.8pt; }
    .layout-a4-4 .r-meta { font-size: 6pt; min-width: 34mm; }
    .layout-a4-4 .r-meta strong { font-size: 7pt; }
    .layout-a4-4 .r-meta .rcpt-no { font-size: 10pt; }
    .layout-a4-4 .r-banner { font-size: 5.8pt; padding: 0.7mm 1.5mm; margin: 0.8mm 0 1mm; }
    .layout-a4-4 .fields { gap: 0.7mm; font-size: 6.6pt; }
    .layout-a4-4 .row { grid-template-columns: 22mm 1fr; gap: 1.2mm; }
    .layout-a4-4 .row.two { grid-template-columns: 22mm 1fr 18mm 1fr; }
    .layout-a4-4 .lbl { font-size: 6pt; }
    .layout-a4-4 .line { min-height: 2.8mm; }
    .layout-a4-4 .amount-box { grid-template-columns: 22mm 1fr; gap: 1.2mm; }
    .layout-a4-4 .amount-value { min-height: 5mm; font-size: 8pt; }
    .layout-a4-4 .purpose { font-size: 6pt; gap: 1mm 2mm; }
    .layout-a4-4 .r-foot { margin-top: 0.6mm; padding-top: 0.6mm; gap: 2mm; }
    .layout-a4-4 .note { font-size: 5pt; }
    .layout-a4-4 .sign .space { height: 4.5mm; }
    .layout-a4-4 .sign { font-size: 5.5pt; }
    .layout-a5-2 .r-top { grid-template-columns: 11mm 1fr auto; gap: 2mm; }
    .layout-a5-2 .r-logo { width: 10mm; }
    .layout-a5-2 .r-org h1 { font-size: 9pt; }
    .layout-a5-2 .fields { gap: 0.85mm; font-size: 7pt; }
    .layout-a5-2 .line { min-height: 3mm; }
    .layout-a5-2 .amount-value { min-height: 5.5mm; font-size: 9pt; }
    .layout-a5-2 .r-foot { margin-top: 0.8mm; padding-top: 0.8mm; }
    .layout-a5-2 .note { font-size: 5.5pt; }
    .layout-a5-2 .sign .space { height: 5mm; }

    .copy-tag {
      position: absolute;
      top: 2mm;
      right: 3mm;
      font-size: 5.5pt;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(11, 42, 86, 0.45);
      border: 0.6pt solid rgba(11, 42, 86, 0.25);
      padding: 0.3mm 1.2mm;
      background: rgba(255, 255, 255, 0.75);
      z-index: 2;
    }
    .perf {
      text-align: center;
      font-size: 5pt;
      letter-spacing: 0.18em;
      color: rgba(11, 42, 86, 0.35);
      margin: 0.4mm 0;
      padding: 0;
      text-transform: uppercase;
      flex: 0 0 auto;
      line-height: 1;
    }

    @media print {
      @page { size: A4 portrait; margin: 3mm; }
      html, body {
        background: #fff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      .screen-hint,
      .screen-controls,
      .download-status { display: none !important; }
      .sheet {
        margin: 0 auto !important;
        border: 0 !important;
        background: #fff !important;
        box-shadow: none !important;
        width: 204mm !important;
        height: 291mm !important;
        max-height: 291mm !important;
        min-height: 0 !important;
        padding: 2mm 3mm !important;
        overflow: hidden !important;
        page-break-after: avoid !important;
        break-inside: avoid !important;
      }
      .sheet.orient-landscape.layout-a5-2 {
        width: 204mm !important;
        height: 142mm !important;
        max-height: 142mm !important;
      }
      .sheet.orient-landscape.layout-a4-3 {
        width: 291mm !important;
        height: 204mm !important;
        max-height: 204mm !important;
      }
      .sheet.orient-landscape.layout-a4-4 {
        width: 291mm !important;
        height: 204mm !important;
        max-height: 204mm !important;
      }
      .sheet.layout-a5-2 {
        width: 142mm !important;
        height: 204mm !important;
        max-height: 204mm !important;
      }
      .sheet.layout-a4-4 {
        width: 204mm !important;
        height: 291mm !important;
        max-height: 291mm !important;
      }
      .receipt {
        border: 0 !important;
        box-shadow: none !important;
        flex: 1 1 0 !important;
        max-height: none !important;
        min-height: 0 !important;
        overflow: hidden !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .r-wm,
      .r-bg-svg,
      .r-banner,
      .copy-tag,
      .rcpt-no {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      .receipt + .receipt { margin-top: 0 !important; border: 0 !important; }
      .perf {
        margin: 0.2mm 0 !important;
        page-break-inside: avoid;
      }
    }
    .download-status {
      max-width: 210mm;
      margin: 0 auto 10px;
      font: 500 13px/1.4 system-ui, sans-serif;
      color: #445;
      text-align: center;
    }
  </style>
</head>
<body>
  <p class="screen-hint">
    Cash receipt booklet — choose layout and orientation. For A5, <strong>Landscape</strong> places two A6 slips side-by-side (vertical tear); <strong>Portrait</strong> stacks them with horizontal tear lines.
  </p>

  <div class="screen-controls" id="receiptControls">
    <label>Layout
      <select id="receiptLayout">
        <option value="a4-3" selected>3 receipts per A4</option>
        <option value="a5-2">2 A6 receipts per A5</option>
        <option value="a4-4">4 A6 receipts per A4</option>
      </select>
    </label>
    <label>Orientation
      <select id="receiptOrientation">
        <option value="portrait" selected>Portrait — stacked slips</option>
        <option value="landscape">Landscape — side-by-side</option>
      </select>
    </label>
    <label>Start receipt no.
      <input id="startReceiptNo" type="number" min="1" max="999999" value="1" step="1">
    </label>
    <label id="pageCountLabel">Pages (3 slips each)
      <input id="pageCount" type="number" min="1" max="100" value="1" step="1">
    </label>
    <label>Paper colour
      <select id="paperTint">
        <option value="white">White</option>
        <option value="cream" selected>Cream</option>
        <option value="ivory">Ivory</option>
        <option value="mint">Mint</option>
        <option value="sky">Sky blue</option>
        <option value="rose">Rose</option>
      </select>
    </label>
    <label>Background pattern
      <select id="paperPattern">
        <option value="none">None</option>
        <option value="lines" selected>Ruled lines</option>
        <option value="diagonal">Diagonal hatch</option>
        <option value="dots">Security dots</option>
        <option value="guilloche">Guilloche</option>
      </select>
    </label>
    <div class="actions">
      <button type="button" id="applyReceiptOpts">Preview</button>
      <button type="button" class="secondary" id="printReceipts">Print series</button>
      <button type="button" class="secondary" id="downloadReceiptPdf">Download PDF</button>
    </div>
  </div>
  <p class="download-status" id="downloadStatus">Series: <strong id="seriesRange">000001 – 000003</strong> (1 page · 3 receipts)</p>

  <div class="sheet layout-a4-3" id="receiptSheet" aria-label="Cash receipt booklet page"></div>

  <template id="receiptTpl">
    <article class="receipt" data-tint="cream" data-pattern="lines">
      <svg class="r-bg-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
      <img class="r-wm" src="../assets/mhws-logo/mhws-logo-watermark.png?v=20260811wm9" alt="" aria-hidden="true">
      <span class="copy-tag">Original</span>
      <header class="r-top">
        <img class="r-logo" src="../assets/mhws-logo/mhws-logo-seal-cert.png" alt="">
        <div class="r-org">
          <h1>Mandi Housing Welfare Society</h1>
          <p class="colony">Himuda Housing Colony Sanyard</p>
          <p class="addr">Housing Colony Sanyard, Mandi HP 175001</p>
        </div>
        <div class="r-meta">
          <strong>Cash Receipt</strong>
          <span class="rcpt-no-label">Receipt No.</span>
          <span class="rcpt-no">000001</span>
          Date<span class="fill"></span>
        </div>
      </header>
      <div class="r-banner">Received with thanks <span class="gold">·</span> Unity · Harmony · Progress</div>
      <div class="fields">
        <div class="row">
          <span class="lbl">Received from</span>
          <span class="line"></span>
        </div>
        <div class="row two">
          <span class="lbl">Plot / House</span>
          <span class="line"></span>
          <span class="lbl">Block</span>
          <span class="line"></span>
        </div>
        <div class="amount-box">
          <span class="lbl">Amount (₹)</span>
          <div class="amount-value"></div>
        </div>
        <div class="row">
          <span class="lbl">In words</span>
          <span class="line"></span>
        </div>
        <div class="row">
          <span class="lbl">Towards</span>
          <div class="purpose">
            <span class="chk"><span class="box"></span> Maintenance / dues</span>
            <span class="chk"><span class="box"></span> Membership</span>
            <span class="chk"><span class="box"></span> Works / donation</span>
            <span class="chk"><span class="box"></span> Other ________</span>
          </div>
        </div>
        <div class="row">
          <span class="lbl">Period / note</span>
          <span class="line"></span>
        </div>
      </div>
      <footer class="r-foot">
        <p class="note">
          <strong>Mode:</strong> Cash only on this slip.<br>
          Subject to verification by the Society. Keep this as your acknowledgement.<br>
          <strong>Web:</strong> housingcolonysanyard.in ·
          <strong>Email:</strong> housingcolonysanyard@gmail.com
        </p>
        <div class="sign">
          <div class="space"></div>
          <div class="who">Authorised signatory</div>
          <div class="role">Treasurer / Office bearer</div>
        </div>
      </footer>
    </article>
  </template>
<script>
(function () {
  const TINTS = {
    white: '#ffffff',
    cream: '#fbf6ea',
    ivory: '#f7f3e8',
    mint: '#eef8f1',
    sky: '#eef4fb',
    rose: '#fbf0f2',
  };

  const LAYOUTS = {
    'a4-3': { slips: 3, label: '3 slips each', pageHint: 'A4' },
    'a5-2': { slips: 2, label: '2 slips each', pageHint: 'A5' },
    'a4-4': { slips: 4, label: '4 slips each', pageHint: 'A4' },
  };

  function orientationKey() {
    const el = document.getElementById('receiptOrientation');
    const v = (el && el.value) || 'portrait';
    return v === 'landscape' ? 'landscape' : 'portrait';
  }

  function isLandscapeSideBySide(layout, orientation) {
    return orientation === 'landscape' && (layout === 'a4-3' || layout === 'a5-2');
  }

  function pad6(n) {
    const v = Math.max(1, Math.min(999999, Number(n) || 1));
    return String(v).padStart(6, '0');
  }

  function layoutKey() {
    const el = document.getElementById('receiptLayout');
    const key = (el && el.value) || 'a4-3';
    return LAYOUTS[key] ? key : 'a4-3';
  }

  function opts() {
    const layout = layoutKey();
    const slips = LAYOUTS[layout].slips;
    const start = Math.max(1, Math.min(999999, parseInt(document.getElementById('startReceiptNo').value, 10) || 1));
    const pages = Math.max(1, Math.min(100, parseInt(document.getElementById('pageCount').value, 10) || 1));
    const tint = document.getElementById('paperTint').value || 'cream';
    const pattern = document.getElementById('paperPattern').value || 'lines';
    const orientation = orientationKey();
    const end = Math.min(999999, start + pages * slips - 1);
    return { start, pages, tint, pattern, layout, orientation, slips, end, total: end - start + 1 };
  }

  function bookletUrl(o, disposition) {
    const q = new URLSearchParams({
      start: String(o.start),
      pages: String(o.pages),
      layout: o.layout,
      orientation: o.orientation,
      tint: o.tint,
      pattern: o.pattern,
      disposition: disposition || 'attachment',
    });
    return `/api/rwa/public/cash-receipt-booklet.pdf?${q.toString()}`;
  }

  function buildBgSvg(tint, pattern) {
    const fill = TINTS[tint] || TINTS.cream;
    const parts = [`<rect width="100%" height="100%" fill="${fill}"/>`];
    if (pattern === 'lines') {
      for (let y = 12; y < 400; y += 14) {
        parts.push(`<line x1="0" y1="${y}" x2="1200" y2="${y}" stroke="rgba(11,42,86,0.08)" stroke-width="1"/>`);
      }
    } else if (pattern === 'diagonal') {
      for (let x = -400; x < 1400; x += 22) {
        parts.push(`<line x1="${x}" y1="0" x2="${x + 420}" y2="420" stroke="rgba(11,42,86,0.07)" stroke-width="1"/>`);
      }
    } else if (pattern === 'dots') {
      for (let y = 10; y < 400; y += 14) {
        for (let x = 10; x < 900; x += 14) {
          parts.push(`<circle cx="${x}" cy="${y}" r="1.1" fill="rgba(11,42,86,0.1)"/>`);
        }
      }
    } else if (pattern === 'guilloche') {
      for (let r = 30; r < 520; r += 28) {
        parts.push(`<circle cx="450" cy="200" r="${r}" fill="none" stroke="rgba(26,107,58,0.07)" stroke-width="1"/>`);
      }
    }
    return parts.join('');
  }

  function decorateReceipt(el, serial, tint, pattern) {
    el.setAttribute('data-tint', tint);
    el.setAttribute('data-pattern', pattern);
    const slot = el.querySelector('.rcpt-no');
    if (slot) slot.textContent = pad6(serial);
    const svg = el.querySelector('.r-bg-svg');
    if (svg) {
      svg.setAttribute('viewBox', '0 0 900 400');
      svg.innerHTML = buildBgSvg(tint, pattern);
    }
  }

  function renderPreview() {
    const o = opts();
    const sheet = document.getElementById('receiptSheet');
    const tpl = document.getElementById('receiptTpl');
    if (!sheet || !tpl) return;
    sheet.className = `sheet layout-${o.layout} orient-${o.orientation}`;
    sheet.replaceChildren();
    document.body.setAttribute('data-print-layout', o.layout);
    document.body.setAttribute('data-print-orientation', o.orientation);
    const pageLabel = document.getElementById('pageCountLabel');
    if (pageLabel) {
      const input = pageLabel.querySelector('#pageCount');
      pageLabel.textContent = '';
      pageLabel.append(`Pages (${LAYOUTS[o.layout].label}) `);
      if (input) pageLabel.appendChild(input);
    }
    const sideBySide = isLandscapeSideBySide(o.layout, o.orientation);
    for (let i = 0; i < o.slips; i += 1) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      decorateReceipt(node, o.start + i, o.tint, o.pattern);
      sheet.appendChild(node);
      if (i < o.slips - 1 && o.layout !== 'a4-4') {
        const perf = document.createElement('div');
        perf.className = sideBySide ? 'perf-vert' : 'perf';
        perf.setAttribute('aria-hidden', 'true');
        perf.textContent = '· · · tear here · · ·';
        sheet.appendChild(perf);
      }
    }
  }

  function syncOrientationDefault() {
    const layout = layoutKey();
    const orientEl = document.getElementById('receiptOrientation');
    if (!orientEl) return;
    // A5 booklet is usually cut with slips side-by-side on landscape A5.
    if (layout === 'a5-2' && !orientEl.dataset.userPicked) {
      orientEl.value = 'landscape';
    }
  }

  function applyOpts() {
    const o = opts();
    document.getElementById('startReceiptNo').value = String(o.start);
    document.getElementById('pageCount').value = String(o.pages);
    const status = document.getElementById('downloadStatus');
    const layoutLabel = LAYOUTS[o.layout].pageHint;
    const orientLabel = o.orientation === 'landscape' ? 'landscape' : 'portrait';
    if (status) {
      status.innerHTML = `Series: <strong id="seriesRange">${pad6(o.start)} – ${pad6(o.end)}</strong> (${o.pages} ${layoutLabel} ${orientLabel} page${o.pages > 1 ? 's' : ''} · ${o.total} receipts)`;
    }
    renderPreview();
  }

  function setStatus(msg) {
    const el = document.getElementById('downloadStatus');
    if (!el) return;
    el.textContent = msg;
  }

  async function downloadPdf() {
    applyOpts();
    const o = opts();
    const btn = document.getElementById('downloadReceiptPdf');
    if (btn) btn.disabled = true;
    setStatus(`Preparing PDF — ${o.pages} page${o.pages > 1 ? 's' : ''} (${pad6(o.start)} – ${pad6(o.end)})…`);
    try {
      const res = await fetch(bookletUrl(o));
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      const blob = await res.blob();
      if (!blob || blob.type.indexOf('pdf') === -1 && blob.size < 100) {
        throw new Error('Invalid PDF response');
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mhws-cash-receipts-${o.layout}-${o.orientation}-${pad6(o.start)}-${pad6(o.end)}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setStatus(`Downloaded ${o.pages} page${o.pages > 1 ? 's' : ''}: ${pad6(o.start)} – ${pad6(o.end)}`);
      setTimeout(applyOpts, 2500);
    } catch (err) {
      console.error(err);
      setStatus('Download failed. Opening PDF in a new tab — use Save / Print from there.');
      window.open(bookletUrl(o), '_blank', 'noopener');
      setTimeout(applyOpts, 3000);
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function printSeries() {
    applyOpts();
    const o = opts();
    setStatus(`Opening ${o.pages}-page PDF for printing (${pad6(o.start)} – ${pad6(o.end)})…`);
    const w = window.open(bookletUrl(o, 'inline'), '_blank', 'noopener');
    if (!w) {
      setStatus('Popup blocked — allow popups, or use Download PDF then print the file.');
      return;
    }
    // PDF viewer: print all pages from there.
    setTimeout(applyOpts, 2000);
  }

  document.getElementById('applyReceiptOpts')?.addEventListener('click', applyOpts);
  document.getElementById('printReceipts')?.addEventListener('click', printSeries);
  document.getElementById('downloadReceiptPdf')?.addEventListener('click', () => {
    downloadPdf().catch(console.error);
  });
  ['startReceiptNo', 'pageCount', 'paperTint', 'paperPattern', 'receiptLayout', 'receiptOrientation'].forEach((id) => {
    document.getElementById(id)?.addEventListener('change', () => {
      if (id === 'receiptOrientation') {
        const el = document.getElementById('receiptOrientation');
        if (el) el.dataset.userPicked = '1';
      }
      if (id === 'receiptLayout') syncOrientationDefault();
      applyOpts();
    });
    document.getElementById(id)?.addEventListener('input', applyOpts);
  });
  syncOrientationDefault();
  applyOpts();
})();
</script>
</body>
</html>
