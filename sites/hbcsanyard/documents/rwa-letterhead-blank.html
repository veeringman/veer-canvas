<!DOCTYPE html>
<html lang="en" class="pad-a4-full pad-a4-blank">
<head>
  <meta charset="UTF-8">
  <title>Himuda Housing Colony Sanyard — Letterhead (blank pad)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    :root {
      --navy: #0b2a56;
      --green: #1a6b3a;
      --gold: #c9a227;
    }
    body {
      margin: 0;
      color: #12233f;
      background: #cfd8e6;
      font-family: "Source Sans 3", system-ui, sans-serif;
    }
    .screen-hint {
      text-align: center;
      padding: 10px;
      font: 500 13px/1.4 system-ui, sans-serif;
      color: #555;
    }
    .sheet {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto 16px;
      padding: 10mm 14mm 0;
      background: #fff;
      border: 1.25pt solid var(--navy);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sheet::before,
    .sheet::after {
      content: "";
      position: absolute;
      top: 0;
      height: 3mm;
    }
    .sheet::before { left: 0; width: 42%; background: var(--navy); }
    .sheet::after { right: 0; width: 42%; background: var(--green); }
    .head {
      display: grid;
      grid-template-columns: 28mm 1fr;
      gap: 7mm;
      align-items: center;
      padding-bottom: 2mm;
      border-bottom: none;
    }
    .rule {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 3mm;
      margin: 0 0 2.2mm;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .rule::before,
    .rule::after {
      content: "";
      height: 0;
      border-top: 1pt solid var(--navy);
    }
    .rule .pip {
      width: 2.2mm;
      height: 2.2mm;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 0 1.2pt #fff, 0 0 0 1.7pt rgba(11, 42, 86, 0.35);
    }
    .seal {
      width: 26mm;
      height: auto;
      display: block;
      border: 0;
      outline: 0;
      box-shadow: none;
      background: transparent;
    }
    .org h1 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 17pt;
      letter-spacing: 0.04em;
      color: var(--navy);
      text-transform: uppercase;
      line-height: 1.1;
    }
    .org .sub {
      margin: 2mm 0 0;
      font-size: 10pt;
      font-weight: 600;
      color: var(--green);
    }
    .org .reg-no {
      margin: 1.2mm 0 0;
      font-size: 9pt;
      font-weight: 700;
      color: var(--muted, #5a6a80);
      letter-spacing: 0.02em;
    }
    .wm {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(112mm, 70%);
      max-height: 46%;
      height: auto;
      object-fit: contain;
      opacity: 0.75;
      pointer-events: none;
      z-index: 0;
    }
    .head, .body-area, .slogan-bar { position: relative; z-index: 1; }
    .body-area {
      flex: 1;
      min-height: 210mm;
    }
    .slogan-bar {
      margin: 0 -14mm;
      background: var(--navy);
      color: #f7f3ea;
      text-align: center;
      padding: 2.2mm 10mm;
      font-size: 9pt;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .slogan-bar .sep { color: var(--gold); margin: 0 1.5mm; letter-spacing: 0; }
    @media print {
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 210mm !important;
        background: #fff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .screen-hint { display: none !important; }
      .sheet {
        width: 210mm !important;
        margin: 0 !important;
        border: 0 !important;
        background: #fff !important;
        box-shadow: none !important;
        overflow: hidden !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
      .wm { opacity: 0.7; }
      .slogan-bar {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
  <link rel="stylesheet" href="print-pad-common.css?v=20260817pad4">
</head>
<body>
  <p class="screen-hint">Blank A4 letterhead pad — Housing Colony Sanyard, Mandi HP 175001</p>
  <div class="sheet">
    <img class="wm" src="../assets/mhws-logo/mhws-logo-watermark.png?v=20260811wm8" alt="" aria-hidden="true">
    <header class="head">
      <img class="seal" src="../assets/mhws-logo/mhws-logo-seal-cert.png?v=20260822logo1" alt="Himuda Housing Colony Sanyard">
      <div class="org">
        <h1>Mandi Housing Welfare Society</h1>
        <p class="colony">Himuda Housing Colony Sanyard</p>
        <p class="sub">Housing Colony Sanyard, Mandi HP 175001</p>
        <p class="reg-no">Registration No. 467 dated 21/07/2012</p>
        <p class="sub">housingcolonysanyard.in</p>
      </div>
    </header>
    <div class="rule" aria-hidden="true"><span class="pip"></span></div>
    <div class="body-area" aria-label="Writing area"></div>
    <div class="slogan-bar">
      Unity<span class="sep">·</span>Harmony<span class="sep">·</span>Progress
    </div>
  </div>
</body>
</html>
