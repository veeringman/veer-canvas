<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shop — City of Mandi</title>
  <meta name="description" content="Order from a City of Mandi shop — menu, cart, pay on delivery.">
  <meta name="theme-color" content="#163c44">
  <link rel="manifest" href="/manifest.webmanifest?v=20260817pwa1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CityOfMandi">
  <meta name="application-name" content="CityOfMandi">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon-64.png?v=20260817pwa1" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260817pwa1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+Devanagari:wght@400;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/portal.css?v=20260817hdr2">
  <script src="/hub-i18n.js?v=20260816lang1" defer></script>
  <script src="/hub-prefs.js?v=20260817hdr2" defer></script>
  <script src="/business.js?v=20260816rentals1" defer></script>
</head>
<body class="shop-body">
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="shop-shell">
    <header class="shop-top">
      <a class="landing-top-brand" href="/#landing-food" aria-label="City of Mandi home">
        <img class="landing-top-seal" src="/assets/cityofmandi-mark.webp?v=20260814paint" alt="" width="36" height="36">
      </a>
      <p class="shop-top-title" id="shopTopTitle">Shop</p>
      <a class="shop-top-link" href="/merchant">Desk</a>
    </header>
    <main class="shop-main" id="bizSection">
      <p class="muted shop-loading">Loading…</p>
    </main>
    <div class="shop-cart-bar" id="shopCartBar" hidden>
      <button type="button" class="shop-cart-btn" id="shopCartOpen">
        <span id="shopCartCount">0</span>
        <span class="shop-cart-label">View cart</span>
        <strong id="shopCartTotal">₹0</strong>
      </button>
    </div>
  </div>

  <div class="shop-sheet" id="shopCartSheet" hidden>
    <div class="shop-sheet-backdrop" data-sheet-close></div>
    <div class="shop-sheet-card" role="dialog" aria-modal="true" aria-labelledby="shopCartTitle">
      <header class="shop-sheet-head">
        <h2 id="shopCartTitle">Your cart</h2>
        <button type="button" class="btn ghost compact" data-sheet-close>Close</button>
      </header>
      <div id="shopCartLines" class="shop-cart-lines"></div>
      <form id="shopCheckout" class="desk-form shop-checkout" novalidate>
        <label>Name <input id="coName" name="name" autocomplete="name" required></label>
        <label>Mobile <input id="coPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" required minlength="10"></label>
        <label>Deliver to <textarea id="coAddress" name="address" rows="2" required placeholder="House / lane / landmark"></textarea></label>
        <label>Note <input id="coNote" name="note" maxlength="200" placeholder="Optional"></label>
        <fieldset class="shop-pay-methods">
          <legend>Pay</legend>
          <label class="merchant-check"><input type="radio" name="payMethod" id="payCod" value="cod" checked> Cash on delivery · COD</label>
          <label class="merchant-check" id="payOnlineWrap" hidden><input type="radio" name="payMethod" id="payOnline" value="online"> Pay online</label>
          <label class="merchant-check" id="payDemoWrap" hidden><input type="radio" name="payMethod" id="payDemo" value="demo"> Pay now (demo)</label>
        </fieldset>
        <p class="muted" id="shopFeeLine"></p>
        <button type="submit" class="btn primary shop-place-btn" id="shopPlaceBtn">Place order · COD</button>
        <p class="error" id="shopOrderError" hidden></p>
      </form>
    </div>
  </div>
</body>
</html>
