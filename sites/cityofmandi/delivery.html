<body class="desk-body delivery-body">
  <div class="atmosphere" aria-hidden="true"></div>
  <div class="desk-shell">
    <header class="desk-top">
      <a class="landing-top-brand" href="/#landing-food">
        <img class="landing-top-seal" src="/assets/cityofmandi-mark.webp?v=20260814paint" alt="" width="40" height="40">
        <span class="landing-top-name">City of Mandi</span>
      </a>
      <p class="desk-kicker">Delivery</p>
      <div class="desk-top-actions">
        <a class="btn ghost compact" href="/labour?mode=login&amp;next=%2Fdelivery">Partner sign-in</a>
        <button type="button" class="btn ghost compact" id="logoutBtn" hidden>Sign out</button>
      </div>
    </header>

    <section class="desk-card" id="deliveryGate">
      <p class="landing-section-kicker">Partners · पार्टनर</p>
      <h1>Delivery jobs</h1>
      <p class="muted">Sign in as a labour or cab partner, then claim open jobs across food, grocery, hardware, and haulage (first accept wins).</p>
      <a class="btn primary" href="/labour?mode=login&amp;next=%2Fdelivery">Sign in to claim</a>
    </section>

    <section class="desk-card" id="deliveryApp" hidden>
      <p class="landing-section-kicker">Open now · खुले जॉब</p>
      <h1>Claim a job</h1>
      <p class="muted" id="deliveryHello"></p>
      <div class="merchant-tabs" role="tablist" id="roleTabs">
        <button type="button" class="btn ghost compact is-tab is-active" data-role="delivery_food">Food</button>
        <button type="button" class="btn ghost compact is-tab" data-role="delivery_grocery">Grocery</button>
        <button type="button" class="btn ghost compact is-tab" data-role="delivery_hardware">Hardware</button>
        <button type="button" class="btn ghost compact is-tab" data-role="haulage">Haulage</button>
      </div>
      <div id="jobsList" class="merchant-orders"></div>
      <button type="button" class="btn ghost" id="refreshJobs">Refresh</button>
    </section>
  </div>
</body>
