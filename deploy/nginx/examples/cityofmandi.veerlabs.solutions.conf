# Virtual host for City of Mandi on the VeerLabs EC2.
# CMS: /cms · hub operators: /admin · businesses: /b/{slug}
server {
    listen 80;
    listen [::]:80;
    server_name cityofmandi.veerlabs.solutions www.cityofmandi.veerlabs.solutions;
    root /var/www/cityofmandi.veerlabs.solutions;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cityofmandi.veerlabs.solutions www.cityofmandi.veerlabs.solutions;
    ssl_certificate /etc/letsencrypt/live/cityofmandi.veerlabs.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cityofmandi.veerlabs.solutions/privkey.pem;
    root /var/www/cityofmandi.veerlabs.solutions;
    index index.html;
    client_max_body_size 20m;

    include /var/www/cityofmandi.veerlabs.solutions/veercanvas/deploy/nginx/examples/cityofmandi-locations.inc;
}
