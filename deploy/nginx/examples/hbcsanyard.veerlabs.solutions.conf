server {
    listen 80;
    listen [::]:80;
    server_name hbcsanyard.veerlabs.solutions www.hbcsanyard.veerlabs.solutions;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hbcsanyard.veerlabs.solutions www.hbcsanyard.veerlabs.solutions;
    ssl_certificate /etc/letsencrypt/live/hbcsanyard.veerlabs.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hbcsanyard.veerlabs.solutions/privkey.pem;
    root /var/www/hbcsanyard.veerlabs.solutions;
    index index.html;
    client_max_body_size 20m;

    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8084/static/;
        proxy_set_header Host $host;
    }

    location ^~ /site/ {
        proxy_pass http://127.0.0.1:8084/site/;
        proxy_set_header Host $host;
    }

    location = /login {
        return 302 /admin/login;
    }

    location = /logout {
        return 302 /admin/logout;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8084/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AuthBuddy Agent + IdP (alternate factor after email OTP)
    location ^~ /agent/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host authbuddy.veerlabs.solutions;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors on;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host authbuddy.veerlabs.solutions;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors on;
    }

    location ^~ /s/ {
        proxy_pass http://127.0.0.1:8084/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unofficial civic hub for Mandi (not a government site).
    location = /cityofmandi { return 302 https://cityofmandi.com/; }
    location = /cityofmandi/ { return 302 https://cityofmandi.com/; }

    # Info Centre OG cards: prefer static HTML, fall back to Flask /s/… (writes + serves).
    location ~ ^/share/doc/(?<share_id>[A-Za-z0-9_-]+)\.html$ {
        try_files /share/doc/$share_id.html @info_share_doc;
    }
    location ~ ^/share/folder/(?<share_id>[A-Za-z0-9_-]+)\.html$ {
        try_files /share/folder/$share_id.html @info_share_folder;
    }
    location @info_share_doc {
        proxy_pass http://127.0.0.1:8084/s/doc/$share_id$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @info_share_folder {
        proxy_pass http://127.0.0.1:8084/s/folder/$share_id$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sw.js {
        types { } default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /projects.json { return 404; }

    location = /catalog-exclusions.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /projects-public.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /site-meta.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
        access_log off;
    }

    # PWA / home-screen icons must not stick for 30d after logo updates.
    location ~* ^/(?:apple-touch-icon\.png|assets/(?:favicon-192\.png|apple-touch-icon(?:-\d+)?\.png|hbcs-sanyard-seal-512(?:-maskable)?\.png))$ {
        etag on;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
        expires 30d;
        access_log off;
    }
}
