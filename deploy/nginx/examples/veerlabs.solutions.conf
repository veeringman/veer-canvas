server {
    listen 80;
    listen [::]:80;
    server_name veerlabs.solutions www.veerlabs.solutions home.veerlabs.solutions;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veerlabs.solutions www.veerlabs.solutions home.veerlabs.solutions;
    ssl_certificate /etc/letsencrypt/live/veerlabs.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veerlabs.solutions/privkey.pem;
    root /var/www/veerlabs.solutions;
    index index.html;

    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8080/static/;
        proxy_set_header Host $host;
    }

    location ^~ /site/ {
        proxy_pass http://127.0.0.1:8080/site/;
        proxy_set_header Host $host;
    }

    location = /login {
        proxy_pass http://127.0.0.1:8080/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:8080/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /projects.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /projects-public.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /site-meta.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
        expires 30d;
        access_log off;
    }
}
