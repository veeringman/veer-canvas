server {
    listen 80;
    listen [::]:80;
    server_name veerlabs.solutions www.veerlabs.solutions home.veerlabs.solutions;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name veerlabs.solutions www.veerlabs.solutions home.veerlabs.solutions;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/veerlabs.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veerlabs.solutions/privkey.pem;
    root /var/www/veerlabs.solutions;
    index index.html;
    client_max_body_size 20m;

    # Branded pages only — never expose nginx/default upstream banners.
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    error_page 502 /errors/502.html;
    error_page 503 /errors/503.html;
    error_page 504 /errors/504.html;

    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_intercept_errors on;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8080/static/;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
    }

    location ^~ /site/ {
        proxy_pass http://127.0.0.1:8080/site/;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
    }

    location = /login {
        return 302 /admin/login;
    }

    location = /logout {
        return 302 /admin/logout;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    # AuthBuddy via VeerSetu on this EC2 (projects/veersetu public gateway).
    # Browser → nginx → 127.0.0.1:18080 (veersetu connect authbuddy) → relay → LAN 192.168.29.78:18080
    # Never proxy directly to 192.168.29.78 from the public site vhost.
    location ^~ /agent/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host authbuddy.veerlabs.solutions;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors on;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host authbuddy.veerlabs.solutions;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors on;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /projects.json {
        return 404;
    }

    location = /catalog-exclusions.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /projects-public.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /site-meta.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
        expires 30d;
        access_log off;
    }
}
