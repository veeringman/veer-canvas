# VeerCanvas Ops — observability dashboard at / (auth via Flask session APIs).
# CMS authoring remains at /admin/ (no metrics there).
server {
    listen 80;
    listen [::]:80;
    server_name ops.veerlabs.solutions www.ops.veerlabs.solutions;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.veerlabs.solutions www.ops.veerlabs.solutions;
    ssl_certificate /etc/letsencrypt/live/ops.veerlabs.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.veerlabs.solutions/privkey.pem;
    root /var/www/ops.veerlabs.solutions;
    index index.html;
    client_max_body_size 20m;

    location = /admin { return 301 /admin/; }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8083/static/;
        proxy_set_header Host $host;
    }

    location ^~ /site/ {
        proxy_pass http://127.0.0.1:8083/site/;
        proxy_set_header Host $host;
    }

    location = /login { return 302 /admin/login?next=/; }
    location = /logout { return 302 /admin/logout; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Observability dashboard shell (session enforced by /api/ops/session + APIs).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose raw CMS catalog JSON if present.
    location = /projects.json { return 404; }
}
