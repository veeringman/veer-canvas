# HTTP bootstrap for cityofmandi.com until Let's Encrypt certs exist.
server {
    listen 80;
    listen [::]:80;
    server_name cityofmandi.com www.cityofmandi.com;
    root /var/www/cityofmandi.veerlabs.solutions;
    index index.html;
    client_max_body_size 20m;

    include /var/www/cityofmandi.veerlabs.solutions/veercanvas/deploy/nginx/examples/cityofmandi-locations.inc;
}
