# Hosted business pages: {slug}.cityofmandi.com → same web root, business.html
# Enable after cityofmandi.com DNS + a wildcard (or per-slug) certificate.
# Until then, pages are served at https://cityofmandi.veerlabs.solutions/b/{slug}
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<biz_slug>[a-z0-9-]+)\.cityofmandi\.com$;
    root /var/www/cityofmandi.veerlabs.solutions;
    index business.html;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
    }

    location / {
        try_files /business.html =404;
    }

    location = /businesses.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|gif|png|svg|ico|webp|ttf|woff|woff2)$ {
        expires 30d;
        access_log off;
    }
}
